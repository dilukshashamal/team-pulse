services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: teampulse_e2e
      POSTGRES_PASSWORD: local_e2e_only
      POSTGRES_DB: teampulse_e2e
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teampulse_e2e -d teampulse_e2e"]
      interval: 1s
      timeout: 5s
      retries: 30
